name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out site and public submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test publication rules
        run: npm run content:test

      - name: Verify committed publication projection
        run: npm run content:verify

      - name: Build Next and Refine engine
        run: npm run build:next

      - name: Build Quartz engine for regression tests
        run: npm run build:quartz
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          QUARTZ_BASE_URL: http://127.0.0.1:3100
          QUARTZ_LOCALES: zh-CN,en-US

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Quartz browser regression tests
        run: npm run test:e2e:run
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
